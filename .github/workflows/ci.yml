name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  contracts:
    name: Gate 0 - shared interface contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Contract guard tests
        run: make contracts

  gate-status:
    name: Gate pass status
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Report gate status
        run: python3 tools/gate-check.py --all --report
