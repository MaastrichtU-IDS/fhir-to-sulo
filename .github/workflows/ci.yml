name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

jobs:
  contracts:
    name: Gate 0 - shared interface contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Contract guard tests
        run: make contracts

  engine-tools:
    name: Gate 1 - schema linter and materialization driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # No Docker here on purpose: these run against ShExJ and engine responses
      # recorded from the pinned image, so the rules that must not regress are
      # tested on every push, not only where a container can start.
      - name: Linter and driver tests
        run: make engine-tests

  engine-live:
    name: Gate 1 - live pinned engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      # Builds the pinned image and re-runs every recorded fixture against it.
      # This is where an engine bump, or a stale recording, announces itself.
      - name: Live engine tests
        run: make engine-live
      - name: Schema pairs lint clean
        run: make lint-schemas

  gate-status:
    name: Gate pass status
    runs-on: ubuntu-latest
    needs: [contracts, engine-tools]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Report gate status
        run: python3 tools/gate-check.py --all --report
